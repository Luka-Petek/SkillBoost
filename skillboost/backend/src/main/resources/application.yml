spring:
  application:
    name: skillboost-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/skillboost}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/SkillBoost}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9080/realms/SkillBoost/protocol/openid-connect/certs}

  gemini:
    api:
      key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    fallback-enabled: ${GEMINI_FALLBACK_ENABLED:false}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:900}
    temperature: ${GEMINI_TEMPERATURE:0.25}
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    thinking-level: ${GEMINI_THINKING_LEVEL:minimal}

skillboost:
  security:
    enabled: ${SKILLBOOST_SECURITY_ENABLED:false}

server:
  port: 8080

logging:
  level:
    com.skillboost: INFO
    org.springframework.security: INFO