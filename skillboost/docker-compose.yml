services:
  mongo:
    image: mongo:7
    container_name: skillboost-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - skillboost_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    container_name: skillboost-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: skillboost-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9080:8080"
    volumes:
      - skillboost_keycloak_data:/opt/keycloak/data/
      - ./keycloak_config:/opt/keycloak/data/import/:ro

  backend:
    build:
      context: ./backend
    container_name: skillboost-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/skillboost
      SPRING_PROFILES_ACTIVE: docker
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_FALLBACK_ENABLED: ${GEMINI_FALLBACK_ENABLED:-false}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-320}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.25}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
      SKILLBOOST_SECURITY_ENABLED: "true"
      KEYCLOAK_ISSUER_URI: http://localhost:9080/realms/SkillBoost
      KEYCLOAK_JWK_SET_URI: http://skillboost-keycloak:8080/realms/SkillBoost/protocol/openid-connect/certs

  frontend:
    build:
      context: ./frontend
    container_name: skillboost-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - keycloak
    ports:
      - "3000:80"

volumes:
  skillboost_mongo_data:
  skillboost_keycloak_data: